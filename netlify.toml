# Tarrelo — configuration Netlify (site statique, comme Melflore).
[build]
  publish = "."

# Une seule adresse officielle : https://tarrelo.com (sans www)
[[redirects]]
  from = "https://www.tarrelo.com/*"
  to = "https://tarrelo.com/:splat"
  status = 301
  force = true


# Anciennes pages par ville (supprimées) : redirection vers la page métier
[[redirects]]
  from = "/plombiers/*"
  to = "/plombiers"
  status = 301

[[redirects]]
  from = "/electriciens/*"
  to = "/electriciens"
  status = 301

[[redirects]]
  from = "/garages/*"
  to = "/garages"
  status = 301

[[redirects]]
  from = "/cabinets-paramedicaux/*"
  to = "/cabinets-paramedicaux"
  status = 301

[[redirects]]
  from = "/agences-immobilieres/*"
  to = "/agences-immobilieres"
  status = 301

[[redirects]]
  from = "/serruriers/*"
  to = "/serruriers"
  status = 301

[[redirects]]
  from = "/peintres/*"
  to = "/peintres"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/merci*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/commande*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
