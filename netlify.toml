# Tarrelo — configuration Netlify (site statique, comme Melflore).
[build]
  publish = "."
  command = "npm install --no-audit --no-fund"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Une seule adresse officielle : https://tarrelo.com (sans www)
[[redirects]]
  from = "https://www.tarrelo.com/*"
  to = "https://tarrelo.com/:splat"
  status = 301
  force = true


# Outils internes : jamais servis
[[redirects]]
  from = "/_outils/*"
  to = "/404"
  status = 404
  force = true

